      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        DeleteReceiptRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/{id}

  GetSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/getSession.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        GetSessionRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /session
            Method: GET

  GetBillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/getBilling.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        GetBillingRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /billing
            Method: GET

  CreateBillingCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/createBillingCheckoutSession.handler

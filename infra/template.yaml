    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/deleteAccount.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucketVersions
              Resource: !GetAtt ReceiptStorageBucket.Arn
            - Effect: Allow
              Action:
                - s3:DeleteObjectVersion
              Resource: !Sub '${ReceiptStorageBucket.Arn}/*'
      Events:

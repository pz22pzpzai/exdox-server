  ResendInviteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/resendInvite.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail

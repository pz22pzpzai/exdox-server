    Properties:
      Handler: dist/aws/handlers/confirmEmail.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        ConfirmEmailRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /confirm-email
            Method: POST
        ConfirmEmailBrowserRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /confirm-email
            Method: GET

  ResendConfirmationEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/resendConfirmationEmail.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        ResendConfirmationEmailRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /confirm-email/resend
            Method: POST

  RequestPasswordResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/requestPasswordReset.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow

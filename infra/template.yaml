  PurgeRecycleBinFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/purgeRecycleBin.handler
      Timeout: 60
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        HourlyRecycleBinPurge:
          Type: Schedule
          Properties:

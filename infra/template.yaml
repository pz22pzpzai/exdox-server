AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: exdox serverless backend for receipt uploads, OCR parsing, and RDS persistence.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ReceiptBucketName:
    Type: String
  OpenAIApiKey:
    Type: String
    NoEcho: true
  OpenAIModel:
    Type: String
    Default: gpt-4.1-nano
  JwtSecret:
    Type: String
    NoEcho: true
  InviteEmailFrom:
    Type: String
    Default: 'contact@exdox.co.uk'
  InviteBaseUrl:
    Type: String
    Default: 'exdox://signup'
  ConfirmEmailBaseUrl:
    Type: String
    Default: 'https://exdox.co.uk/confirm-email'
  ConfirmEmailEndpointBaseUrl:
    Type: String
    Default: 'https://hz2zkm6jkf.execute-api.eu-west-2.amazonaws.com/prod/confirm-email'
  ConfirmEmailLoginUrl:
    Type: String
    Default: 'https://exdox.co.uk/login'
  ResetPasswordBaseUrl:
    Type: String
    Default: 'https://exdox.co.uk/reset-password'
  ReceiptStoreMode:
    Type: String
    Default: s3
  DbHost:
    Type: String
    Default: ''
  DbPort:
    Type: Number
    Default: 3306
  DbName:
    Type: String
    Default: receiptflow
  DbUser:
    Type: String
    Default: ''
  DbPassword:
    Type: String
    Default: ''
    NoEcho: true
  DbIamAuthEnabled:
    Type: String
    Default: 'false'
  DbIamRegion:
    Type: String
    Default: 'eu-west-2'
  StripeSecretKey:
    Type: String
    Default: ''
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
  StripeCheckoutSuccessUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing?checkout=success'
  StripeCheckoutCancelUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing?checkout=cancelled'
  StripeBillingPortalReturnUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing'
  StripePriceCaptureMonthly:
    Type: String
    Default: ''
  StripePriceCaptureAnnual:
    Type: String
    Default: ''
  StripePriceControlMonthly:
    Type: String
    Default: ''
  StripePriceControlAnnual:
    Type: String
    Default: ''
  StripePriceOperationsMonthly:
    Type: String
    Default: ''
  StripePriceOperationsAnnual:
    Type: String
    Default: ''
  StripePriceEnterpriseMonthly:
    Type: String
    Default: ''
  StripePriceEnterpriseAnnual:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 1024
    Timeout: 60
    Handler: dist/aws/index.handler
    CodeUri: ..
    Environment:
      Variables:
        RECEIPT_BUCKET_NAME: !Ref ReceiptBucketName
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel
        JWT_SECRET: !Ref JwtSecret
        INVITE_EMAIL_FROM: !Ref InviteEmailFrom
        INVITE_BASE_URL: !Ref InviteBaseUrl
        CONFIRM_EMAIL_BASE_URL: !Ref ConfirmEmailBaseUrl
        CONFIRM_EMAIL_ENDPOINT_BASE_URL: !Ref ConfirmEmailEndpointBaseUrl
        CONFIRM_EMAIL_LOGIN_URL: !Ref ConfirmEmailLoginUrl
        RESET_PASSWORD_BASE_URL: !Ref ResetPasswordBaseUrl
        RECEIPT_STORE_MODE: !Ref ReceiptStoreMode
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_IAM_AUTH_ENABLED: !Ref DbIamAuthEnabled
        DB_IAM_REGION: !Ref DbIamRegion
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        STRIPE_CHECKOUT_SUCCESS_URL: !Ref StripeCheckoutSuccessUrl
        STRIPE_CHECKOUT_CANCEL_URL: !Ref StripeCheckoutCancelUrl
        STRIPE_BILLING_PORTAL_RETURN_URL: !Ref StripeBillingPortalReturnUrl
        STRIPE_PRICE_CAPTURE_MONTHLY: !Ref StripePriceCaptureMonthly
        STRIPE_PRICE_CAPTURE_ANNUAL: !Ref StripePriceCaptureAnnual
        STRIPE_PRICE_CONTROL_MONTHLY: !Ref StripePriceControlMonthly
        STRIPE_PRICE_CONTROL_ANNUAL: !Ref StripePriceControlAnnual
        STRIPE_PRICE_OPERATIONS_MONTHLY: !Ref StripePriceOperationsMonthly
        STRIPE_PRICE_OPERATIONS_ANNUAL: !Ref StripePriceOperationsAnnual
        STRIPE_PRICE_ENTERPRISE_MONTHLY: !Ref StripePriceEnterpriseMonthly
        STRIPE_PRICE_ENTERPRISE_ANNUAL: !Ref StripePriceEnterpriseAnnual
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Resources:
  ReceiptApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      SecurityPolicy: SecurityPolicy_TLS12_PFS_2025_EDGE
      EndpointAccessMode: STRICT
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - multipart/form-data
        - application/pdf
        - image/jpeg
        - image/png
        - image/webp

  ReceiptApiDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ReceiptApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  ReceiptApiDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ReceiptApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  ReceiptStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ReceiptBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ReceiptStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReceiptStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${ReceiptStorageBucket.Arn}'
              - !Sub '${ReceiptStorageBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${ReceiptStorageBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/health.handler
      Events:
        HealthRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /health
            Method: GET

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/createUploadUrl.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        UploadRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /upload/presign
            Method: POST

  ProcessExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/processExpense.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - AWSLambdaBasicExecutionRole
      Events:
        ProcessLegacyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /api/v1/expenses/process
            Method: POST
        ProcessReceiptsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/process
            Method: POST

  ListReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/listReceipts.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        ListReceiptsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts
            Method: GET

  ListClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/listClaims.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        ListClaimsRoute:
          Type: Api

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/contact.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow

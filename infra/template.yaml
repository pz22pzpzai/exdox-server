AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: exdox serverless backend for receipt uploads, OCR parsing, and RDS persistence.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ReceiptBucketName:
    Type: String
  OpenAIApiKey:
    Type: String
    NoEcho: true
  OpenAIModel:
    Type: String
    Default: gpt-6-luna
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleWebClientId:
    Type: String
    Default: ''
  InviteEmailFrom:
    Type: String
    Default: 'contact@exdox.co.uk'
  InviteBaseUrl:
    Type: String
    Default: 'https://exdox.co.uk/register'
  ConfirmEmailBaseUrl:
    Type: String
    Default: 'https://exdox.co.uk/confirm-email'
  ConfirmEmailEndpointBaseUrl:
    Type: String
    Default: 'https://hz2zkm6jkf.execute-api.eu-west-2.amazonaws.com/prod/confirm-email'
  ConfirmEmailLoginUrl:
    Type: String
    Default: 'https://exdox.co.uk/login'
  ResetPasswordBaseUrl:
    Type: String
    Default: 'https://exdox.co.uk/reset-password'
  SalesInboundDomain:
    Type: String
    Default: 'sales.exdox.co.uk'
  CostsInboundDomain:
    Type: String
    Default: 'costs.exdox.co.uk'
  ReceiptStoreMode:
    Type: String
    Default: s3
  DbHost:
    Type: String
    Default: ''
  DbPort:
    Type: Number
    Default: 3306
  DbName:
    Type: String
    Default: receiptflow
  DbUser:
    Type: String
    Default: ''
  DbPassword:
    Type: String
    Default: ''
    NoEcho: true
  DbIamAuthEnabled:
    Type: String
    Default: 'false'
  DbIamRegion:
    Type: String
    Default: 'eu-west-2'
  StripeSecretKey:
    Type: String
    Default: ''
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
  StripeConnectWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
  XeroClientId:
    Type: String
    Default: ''
    NoEcho: true
  XeroClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  HmrcVatSandboxClientId:
    Type: String
    Default: ''
    NoEcho: true
  HmrcVatSandboxClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  TrueLayerDataClientId:
    Type: String
    Default: ''
    NoEcho: true
  TrueLayerDataClientSecret:
    Type: String
    Default: ''
    NoEcho: true
  TrueLayerDataEnvironment:
    Type: String
    Default: production
    AllowedValues: [sandbox, production]
  TrueLayerAisRegulatoryApproved:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  MapboxAccessToken:
    Type: String
    Default: ''
    NoEcho: true
  StripeCheckoutSuccessUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing?checkout=success'
  StripeCheckoutCancelUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing?checkout=cancelled'
  StripeBillingPortalReturnUrl:
    Type: String
    Default: 'https://exdox.co.uk/billing'
  StripePriceCaptureMonthly:
    Type: String
    Default: ''
  StripePriceCaptureAnnual:
    Type: String
    Default: ''
  StripePriceControlMonthly:
    Type: String
    Default: ''
  StripePriceControlAnnual:
    Type: String
    Default: ''
  StripePriceOperationsMonthly:
    Type: String
    Default: ''
  StripePriceOperationsAnnual:
    Type: String
    Default: ''
  StripePriceEnterpriseMonthly:
    Type: String
    Default: ''
  StripePriceEnterpriseAnnual:
    Type: String
    Default: ''

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 1024
    Timeout: 60
    Handler: dist/aws/index.handler
    CodeUri: ..
    Environment:
      Variables:
        RECEIPT_BUCKET_NAME: !Ref ReceiptBucketName
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel
        JWT_SECRET: !Ref JwtSecret
        GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
        INVITE_EMAIL_FROM: !Ref InviteEmailFrom
        INVITE_BASE_URL: !Ref InviteBaseUrl
        CONFIRM_EMAIL_BASE_URL: !Ref ConfirmEmailBaseUrl
        CONFIRM_EMAIL_ENDPOINT_BASE_URL: !Ref ConfirmEmailEndpointBaseUrl
        CONFIRM_EMAIL_LOGIN_URL: !Ref ConfirmEmailLoginUrl
        RESET_PASSWORD_BASE_URL: !Ref ResetPasswordBaseUrl
        SALES_INBOUND_DOMAIN: !Ref SalesInboundDomain
        COSTS_INBOUND_DOMAIN: !Ref CostsInboundDomain
        RECEIPT_STORE_MODE: !Ref ReceiptStoreMode
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_IAM_AUTH_ENABLED: !Ref DbIamAuthEnabled
        DB_IAM_REGION: !Ref DbIamRegion
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        STRIPE_CONNECT_WEBHOOK_SECRET: !Ref StripeConnectWebhookSecret
        XERO_CLIENT_ID: !Ref XeroClientId
        XERO_CLIENT_SECRET: !Ref XeroClientSecret
        HMRC_VAT_SANDBOX_CLIENT_ID: !Ref HmrcVatSandboxClientId
        HMRC_VAT_SANDBOX_CLIENT_SECRET: !Ref HmrcVatSandboxClientSecret
        TRUELAYER_DATA_CLIENT_ID: !Ref TrueLayerDataClientId
        TRUELAYER_DATA_CLIENT_SECRET: !Ref TrueLayerDataClientSecret
        TRUELAYER_DATA_ENVIRONMENT: !Ref TrueLayerDataEnvironment
        TRUELAYER_AIS_REGULATORY_APPROVED: !Ref TrueLayerAisRegulatoryApproved
        MAPBOX_ACCESS_TOKEN: !Ref MapboxAccessToken
        STRIPE_CHECKOUT_SUCCESS_URL: !Ref StripeCheckoutSuccessUrl
        STRIPE_CHECKOUT_CANCEL_URL: !Ref StripeCheckoutCancelUrl
        STRIPE_BILLING_PORTAL_RETURN_URL: !Ref StripeBillingPortalReturnUrl
        STRIPE_PRICE_CAPTURE_MONTHLY: !Ref StripePriceCaptureMonthly
        STRIPE_PRICE_CAPTURE_ANNUAL: !Ref StripePriceCaptureAnnual
        STRIPE_PRICE_CONTROL_MONTHLY: !Ref StripePriceControlMonthly
        STRIPE_PRICE_CONTROL_ANNUAL: !Ref StripePriceControlAnnual
        STRIPE_PRICE_OPERATIONS_MONTHLY: !Ref StripePriceOperationsMonthly
        STRIPE_PRICE_OPERATIONS_ANNUAL: !Ref StripePriceOperationsAnnual
        STRIPE_PRICE_ENTERPRISE_MONTHLY: !Ref StripePriceEnterpriseMonthly
        STRIPE_PRICE_ENTERPRISE_ANNUAL: !Ref StripePriceEnterpriseAnnual
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

Resources:
  AccountingEmailConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub '${EnvironmentName}-exdox-accounting'

  AccountingEmailEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref AccountingEmailConfigurationSet
      EventDestination:
        Name: AccountingEmailEvents
        Enabled: true
        MatchingEventTypes: [DELIVERY, BOUNCE, COMPLAINT, REJECT, DELIVERY_DELAY]
        EventBridgeDestination:
          EventBusArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default'

  ReceiptApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      SecurityPolicy: SecurityPolicy_TLS12_PFS_2025_EDGE
      EndpointAccessMode: STRICT
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - multipart/form-data
        - application/pdf
        - image/jpeg
        - image/png
        - image/webp

  ReceiptApiDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ReceiptApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  ReceiptApiDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ReceiptApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  ReceiptStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ReceiptBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  ReceiptStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReceiptStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${ReceiptStorageBucket.Arn}'
              - !Sub '${ReceiptStorageBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyIncorrectEncryptionHeader
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${ReceiptStorageBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'

  CostsInboundBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawEmailsAfterSevenDays
            Status: Enabled
            ExpirationInDays: 7

  CostsInboundBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CostsInboundBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireSecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt CostsInboundBucket.Arn
              - !Sub '${CostsInboundBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: PermitSesEmailStorage
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${CostsInboundBucket.Arn}/costs/*'
            Condition:
              StringEquals:
                'AWS:SourceAccount': !Ref AWS::AccountId
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${EnvironmentName}-exdox-costs-inbound:receipt-rule/CostsDocuments'

  CostsInboundRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Sub '${EnvironmentName}-exdox-costs-inbound'

  CostsInboundPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CostsEmailReceiveFunction.Arn
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${EnvironmentName}-exdox-costs-inbound:receipt-rule/CostsDocuments'

  CostsInboundRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - CostsInboundBucketPolicy
      - CostsInboundPermission
    Properties:
      RuleSetName: !Ref CostsInboundRuleSet
      Rule:
        Name: CostsDocuments
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients:
          - !Ref CostsInboundDomain
        Actions:
          - S3Action:
              BucketName: !Ref CostsInboundBucket
              ObjectKeyPrefix: costs/
          - LambdaAction:
              FunctionArn: !GetAtt CostsEmailReceiveFunction.Arn
              InvocationType: Event

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/health.handler
      Events:
        HealthRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /health
            Method: GET

  CreateUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/createUploadUrl.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        UploadRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /upload/presign
            Method: POST

  ProcessExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/processExpense.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - AWSLambdaBasicExecutionRole
      Events:
        ProcessLegacyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /api/v1/expenses/process
            Method: POST
        ProcessReceiptsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts/process
            Method: POST

  ListReceiptsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/listReceipts.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        ListReceiptsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /receipts
            Method: GET

  ListClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/listClaims.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        ListClaimsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /claims
            Method: GET

  CreateClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/createClaim.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        CreateClaimRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /claims
            Method: POST

  CalculateMileageRouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/calculateMileageRoute.handler
      Timeout: 20
      Events:
        CalculateMileageRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /mileage/route
            Method: POST

  AttachReceiptToClaimFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/attachReceiptToClaim.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        AttachReceiptToClaimRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /claims/attach
            Method: POST

  ExportMasterExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/exportMasterExpenses.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        ExportMasterExpensesRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /claims/master-export
            Method: POST

  ExportEmployeeReimbursementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/exportEmployeeReimbursements.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        ExportEmployeeReimbursementsRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /costs/reimbursement-export
            Method: POST

  MarkEmployeeReimbursementsPaidFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/markEmployeeReimbursementsPaid.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        MarkEmployeeReimbursementsPaidRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /costs/reimbursement-mark-paid
            Method: POST

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/login.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        LoginRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /login
            Method: POST

  GoogleAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/googleAuth.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        GoogleAuthRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /auth/google
            Method: POST
        GoogleAuthConfigRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /auth/google
            Method: GET

  TwoFactorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/twoFactor.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        TwoFactorGetRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /two-factor
            Method: GET
        TwoFactorPostRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /two-factor
            Method: POST

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/register.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
      Events:
        RegisterRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /register

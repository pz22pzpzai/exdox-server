  TeamCreateDepartmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/team.createDepartmentHandler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        TeamCreateDepartmentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /team
            Method: POST

  TeamAssignDepartmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/team.assignDepartmentHandler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        TeamAssignDepartmentRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /team
            Method: PUT

  TeamRemoveMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/aws/handlers/team.removeMemberHandler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReceiptBucketName
      Events:
        TeamRemoveMemberRoute:
          Type: Api
          Properties:
            RestApiId: !Ref ReceiptApi
            Path: /team/{userId}
